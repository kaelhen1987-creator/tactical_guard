<section class="section section--paper" id="app" aria-labelledby="app-title">
  <div class="container">
    <div class="section-head">
      <h2 id="app-title">Así se ve Tactical Guard.</h2>
      <p class="lead">Una app en el celular del guardia y un panel web para quien supervisa. Capturas reales del producto.</p>
    </div>

    <div class="row g-4 g-lg-5 align-items-start">
      <div class="col-lg-4">
        <div class="showcase-tabs" role="tablist" aria-label="Pantallas de la app">
          <button class="showcase-tab active" id="tab-rondas" data-bs-toggle="pill" data-bs-target="#pane-rondas" type="button" role="tab" aria-controls="pane-rondas" aria-selected="true">
            <strong>Bitácora de rondas</strong><span>Panel web: foto, hora, coordenadas y validez de cada marca.</span>
          </button>
          <button class="showcase-tab" id="tab-incidentes" data-bs-toggle="pill" data-bs-target="#pane-incidentes" type="button" role="tab" aria-controls="pane-incidentes" aria-selected="false">

          </button>
          <button class="showcase-tab" id="tab-acceso" data-bs-toggle="pill" data-bs-target="#pane-acceso" type="button" role="tab" aria-controls="pane-acceso" aria-selected="false">

          </button>
          <button class="showcase-tab" id="tab-turno" data-bs-toggle="pill" data-bs-target="#pane-turno" type="button" role="tab" aria-controls="pane-turno" aria-selected="false">

      <div class="col-lg-8">
        <div class="showcase-stage">

            <div class="tab-pane fade show active" id="pane-rondas" role="tabpanel" aria-labelledby="tab-rondas" tabindex="0">
              <div class="tg-browser">
                <div class="tg-browser__bar" aria-hidden="true"><i></i><i></i><i></i></div>
                <img src="assets/img/panel-rondas.webp" width="1280" height="820" loading="lazy" alt="Panel de auditoría y bitácora de rondas con indicadores de cumplimiento de geocerca y registros con foto">
              </div>
            </div>
            <div class="tab-pane fade" id="pane-incidentes" role="tabpanel" aria-labelledby="tab-incidentes" tabindex="0">
              <div class="tg-browser">
                <div class="tg-browser__bar" aria-hidden="true"><i></i><i></i><i></i></div>
                <img src="assets/img/panel-incidentes.webp" width="1280" height="820" loading="lazy" alt="Muro de incidentes con tarjetas de emergencia médica e intrusión, cada una con foto, instalación, RUT y hora">

            </div>
            <div class="tab-pane fade" id="pane-acceso" role="tabpanel" aria-labelledby="tab-acceso" tabindex="0">

              <div class="showcase-phones">
                <div class="tg-device"><img src="assets/img/app-login.webp" width="390" height="844" loading="lazy" alt="Pantalla de ingreso para personal de seguridad con correo y contraseña"></div>
                <div class="tg-device"><img src="assets/img/app-inicio-turno.webp" width="390" height="844" loading="lazy" alt="Pantalla de inicio de turno con punto de control y RUT del guardia"></div>
