<section class="section" id="funciones" aria-labelledby="funciones-title">
  <div class="container">
    <div class="section-head">
      <h2 id="funciones-title">Mira cada función en acción.</h2>
      <p class="lead">Elige dónde se usa, en la garita (app móvil) o en la oficina (panel web), y mira cada función en las pantallas reales de Tactical Guard.</p>
    </div>

    <div class="fx" id="fx">
      <div class="fx-nav">
        <div class="fx-roles" role="group" aria-label="Elegir dónde se usa">
          <button type="button" class="fx-role is-on" data-role="app" aria-pressed="true"><i class="bi bi-phone" aria-hidden="true"></i> App móvil</button>
          <button type="button" class="fx-role" data-role="panel" aria-pressed="false"><i class="bi bi-display" aria-hidden="true"></i> Panel web</button>
        </div>

        <div class="fx-list" role="tablist" aria-orientation="vertical" aria-label="Funciones">
          <button class="fx-item" role="tab" id="fxt-acceso" aria-controls="fx-acceso" data-role="app" data-panel="acceso" type="button">
            <i class="bi bi-person-vcard" aria-hidden="true"></i>
            <span><strong>Control de acceso</strong><small>RUT en cualquier formato o escáner de cédula.</small></span>
          </button>
          <button class="fx-item" role="tab" id="fxt-ronda" aria-controls="fx-ronda" data-role="app" data-panel="ronda" type="button">
            <i class="bi bi-geo-alt" aria-hidden="true"></i>
            <span><strong>Rondas con geocerca</strong><small>La marca solo vale dentro del radio del punto.</small></span>
          </button>
          <button class="fx-item" role="tab" id="fxt-novedad" aria-controls="fx-novedad" data-role="app" data-panel="novedad" type="button">
            <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
            <span><strong>Novedades con foto</strong><small>Reporta el hecho con evidencia, al momento.</small></span>
          </button>
          <button class="fx-item" role="tab" id="fxt-sos" aria-controls="fx-sos" data-role="app" data-panel="sos" type="button">
            <i class="bi bi-broadcast" aria-hidden="true"></i>
            <span><strong>Botón SOS</strong><small>Siempre visible. La alerta llega a operaciones.</small></span>
          </button>

          <button class="fx-item" role="tab" id="fxt-bitacora" aria-controls="fx-bitacora" data-role="panel" data-panel="bitacora" type="button" hidden>
            <i class="bi bi-clipboard-check" aria-hidden="true"></i>
            <span><strong>Bitácora de rondas</strong><small>Foto, hora, coordenadas y validez de cada marca.</small></span>
          </button>
          <button class="fx-item" role="tab" id="fxt-muro" aria-controls="fx-muro" data-role="panel" data-panel="muro" type="button" hidden>
            <i class="bi bi-grid-3x2-gap" aria-hidden="true"></i>
            <span><strong>Muro de incidentes</strong><small>Los hechos de todas tus instalaciones en un lugar.</small></span>
          </button>
          <button class="fx-item" role="tab" id="fxt-pdf" aria-controls="fx-pdf" data-role="panel" data-panel="pdf" type="button" hidden>
            <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>
            <span><strong>Informes ejecutivos en PDF</strong><small>Listos para entregar a tu cliente.</small></span>
          </button>
          <button class="fx-item" role="tab" id="fxt-padron" aria-controls="fx-padron" data-role="panel" data-panel="padron" type="button" hidden>
            <i class="bi bi-people" aria-hidden="true"></i>
            <span><strong>Padrón por CSV</strong><small>Carga la lista blanca de cada faena y bloquea o habilita personas.</small></span>
          </button>
          <button class="fx-item" role="tab" id="fxt-instal" aria-controls="fx-instal" data-role="panel" data-panel="instal" type="button" hidden>
            <i class="bi bi-buildings" aria-hidden="true"></i>
            <span><strong>Instalaciones y accesos</strong><small>Crea y edita cada instalación con su ubicación; bloquéala cuando haga falta.</small></span>
          </button>
        </div>
      </div>

      <div class="fx-stage">
        <span class="fx-badge" id="fxBadge"><i class="bi bi-phone" aria-hidden="true"></i> App móvil del guardia</span>

        <!-- 1 · Acceso (Móvil) -->
        <div class="fx-panel fx-panel--shot" role="tabpanel" id="fx-acceso" aria-labelledby="fxt-acceso" tabindex="0" hidden>
          <figure class="fx-shot fx-shot--phone">
            <img src="assets/img/app-control-acceso.webp" width="646" height="1438" alt="Pantalla de control de acceso peatonal de la app: campo de RUT, botón Validar acceso y botón SOS" loading="lazy">
          </figure>
        </div>

        <!-- 2 · Ronda (Móvil - Placeholder si no existe) -->
        <div class="fx-panel fx-panel--shot" role="tabpanel" id="fx-ronda" aria-labelledby="fxt-ronda" tabindex="0" hidden>
          <figure class="fx-shot fx-shot--phone">
            <img src="assets/img/app-ronda.webp" width="646" height="1438" alt="Pantalla de ronda de la app: punto de vigilancia, GPS validado y botón Tomar evidencia" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" style="display:block; width:100%; height:auto;">
            <div class="tg-placeholder tg-placeholder--phone" style="display:none;">
              <i class="bi bi-geo-alt"></i>
              <strong>assets/img/app-ronda.webp</strong>
              <div class="tg-placeholder-meta"><i class="bi bi-phone"></i> Formato móvil (646 × 1438 px)</div>
              <small>Pantalla de ronda: punto de vigilancia, GPS validado y botón Tomar evidencia.</small>
            </div>
          </figure>
        </div>

        <!-- 3 · Novedad (Móvil - Placeholder si no existe) -->
        <div class="fx-panel fx-panel--shot" role="tabpanel" id="fx-novedad" aria-labelledby="fxt-novedad" tabindex="0" hidden>
          <figure class="fx-shot fx-shot--phone">
            <img src="assets/img/app-novedad.webp" width="646" height="1438" alt="Pantalla Reportar novedad de la app: tipo, descripción y botón Tomar evidencia" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" style="display:block; width:100%; height:auto;">
            <div class="tg-placeholder tg-placeholder--phone" style="display:none;">
              <i class="bi bi-exclamation-triangle"></i>
              <strong>assets/img/app-novedad.webp</strong>
              <div class="tg-placeholder-meta"><i class="bi bi-phone"></i> Formato móvil (646 × 1438 px)</div>
              <small>Pantalla Reportar novedad: tipo, descripción y botón Tomar evidencia.</small>
            </div>
          </figure>
        </div>

        <!-- 4 · SOS (Móvil) -->
        <div class="fx-panel fx-panel--shot" role="tabpanel" id="fx-sos" aria-labelledby="fxt-sos" tabindex="0" hidden>
          <figure class="fx-shot fx-shot--phone">
            <img src="assets/img/app-control-acceso.webp" width="646" height="1438" alt="Botón SOS siempre visible en la esquina de la pantalla de la app" loading="lazy">
          </figure>
        </div>

        <!-- 5 · Bitácora (Panel Web) -->
        <div class="fx-panel fx-panel--shot" role="tabpanel" id="fx-bitacora" aria-labelledby="fxt-bitacora" tabindex="0" hidden>
          <figure class="fx-shot fx-shot--desk">
            <img src="assets/img/panel-rondas.webp" width="1600" height="896" alt="Panel web con la bitácora de rondas: foto, hora, coordenadas y geocerca de cada marca" loading="lazy">
          </figure>
        </div>

        <!-- 6 · Muro (Panel Web) -->
        <div class="fx-panel fx-panel--shot" role="tabpanel" id="fx-muro" aria-labelledby="fxt-muro" tabindex="0" hidden>
          <figure class="fx-shot fx-shot--desk">
            <img src="assets/img/panel-incidentes.webp" width="1600" height="896" alt="Panel web con el muro de incidentes de todas las instalaciones" loading="lazy">
          </figure>
        </div>

        <!-- 7 · PDF (Panel Web) -->
        <div class="fx-panel fx-panel--shot" role="tabpanel" id="fx-pdf" aria-labelledby="fxt-pdf" tabindex="0" hidden>
          <figure class="fx-shot fx-shot--desk">
            <img src="assets/img/panel-incidentes.webp" width="1600" height="896" alt="Panel web con el botón Exportar informe PDF" loading="lazy">
          </figure>
        </div>

        <!-- 8 · Padrón (Panel Web - Placeholder si no existe) -->
        <div class="fx-panel fx-panel--shot" role="tabpanel" id="fx-padron" aria-labelledby="fxt-padron" tabindex="0" hidden>
          <figure class="fx-shot fx-shot--desk">
            <img src="assets/img/panel-padron.webp" width="1600" height="896" alt="Panel web con la gestión del padrón de acceso" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" style="display:block; width:100%; height:auto;">
            <div class="tg-placeholder" style="display:none;">
              <i class="bi bi-people"></i>
              <strong>assets/img/panel-padron.webp</strong>
              <div class="tg-placeholder-meta"><i class="bi bi-display"></i> Resolución recomendada: 1600 × 896 px</div>
              <small>Panel web con la gestión del padrón de acceso: carga CSV y estados activo o bloqueado.</small>
            </div>
          </figure>
        </div>

        <!-- 9 · Instalaciones (Panel Web - Placeholder si no existe) -->
        <div class="fx-panel fx-panel--shot" role="tabpanel" id="fx-instal" aria-labelledby="fxt-instal" tabindex="0" hidden>
          <figure class="fx-shot fx-shot--desk">
            <img src="assets/img/panel-instalaciones.webp" width="1600" height="896" alt="Panel web con la gestión de instalaciones" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" style="display:block; width:100%; height:auto;">
            <div class="tg-placeholder" style="display:none;">
              <i class="bi bi-buildings"></i>
              <strong>assets/img/panel-instalaciones.webp</strong>
              <div class="tg-placeholder-meta"><i class="bi bi-display"></i> Resolución recomendada: 1600 × 896 px</div>
              <small>Panel web con la gestión de instalaciones: ID, nombre, ubicación, estado y acciones.</small>
            </div>
          </figure>
        </div>
      </div>
    </div>
  </div>
</section>
